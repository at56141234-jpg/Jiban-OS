<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Disaster Alert Nepal — Intelligent Disaster Awareness & Emergency Response">
  <title>Disaster Alert Nepal</title>
  
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/screens.css">
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand-wrapper" id="brand-identity">
        <svg class="mountain-logo" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M4 32 L16 12 L22 22 L27 15 L36 32 Z" fill="#1e3a8a" stroke="#1e3a8a" stroke-linejoin="round"/>
          <path d="M16 12 L18 17 L21 16 Z" fill="#ffffff" stroke="#ffffff"/>
          <path d="M27 15 L29 19 L31 18 Z" fill="#ffffff" stroke="#ffffff"/>
        </svg>
        <span class="brand-text">Disaster Alert<br><small style="font-size:11px;font-weight:700;color:#64748b;">Nepal</small></span>
      </div>

      <div class="top-bar-actions">
        <button class="btn-notif" id="btn-notif-bell" aria-label="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          <span class="notif-dot hidden" id="notif-unread-dot"></span>
        </button>

        <button class="user-avatar-btn" id="user-profile-avatar-btn" aria-label="Account">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </button>
      </div>
    </header>

    <main class="main-content">
      <div id="screen-home" class="screen-container active"></div>
      <div id="screen-guides" class="screen-container"></div>
      <div id="screen-map" class="screen-container"></div>
      <div id="screen-alerts" class="screen-container"></div>
      <div id="screen-more" class="screen-container"></div>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-screen="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>Home</span>
      </button>

      <button class="nav-item" data-screen="guides">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        <span>Guides</span>
      </button>

      <button class="nav-item" data-screen="map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        <span>Map</span>
      </button>

      <button class="nav-item" data-screen="alerts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <span>Alerts</span>
      </button>

      <button class="nav-item" data-screen="more">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="5" r="2.5"/><circle cx="19" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/></svg>
        <span>More</span>
      </button>
    </nav>

    <div class="notification-backdrop" id="notification-backdrop"></div>
    <div class="notification-panel" id="notification-panel">
      <div class="notif-header">
        <div class="notif-header-title">
          <span>Notifications</span>
          <span class="chip" id="notif-panel-count" style="background:#fee2e2;color:#dc2626;border:none;font-weight:800;">0 new</span>
        </div>
        <button id="notif-close-btn" class="btn-icon" style="background:none;border:none;font-size:18px;cursor:pointer;">✕</button>
      </div>

      <div style="padding:10px 16px;border-bottom:1px solid var(--border-light);display:flex;justify-content:flex-end;">
        <button class="btn-text" id="notif-mark-all-btn" style="color:#2563eb;font-weight:700;font-size:12px;background:none;border:none;cursor:pointer;">Mark all as read</button>
      </div>

      <div class="notif-filters">
        <button class="chip notif-filter-chip active" data-cat="all">All</button>
        <button class="chip notif-filter-chip" data-cat="warning">Warnings</button>
        <button class="chip notif-filter-chip" data-cat="sos">SOS Updates</button>
        <button class="chip notif-filter-chip" data-cat="announcement">Bulletins</button>
        <button class="chip notif-filter-chip" data-cat="risk">Risk</button>
      </div>

      <div class="notif-list" id="notif-items-container"></div>
    </div>

    <div class="toast-container" id="toast-container"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
